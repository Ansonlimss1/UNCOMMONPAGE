<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <title>Owner orders | uncommon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .owner-main{max-width:1120px;margin:0 auto;padding:58px 5% 90px}.owner-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:35px}.owner-head h1{font:500 clamp(38px,6vw,66px)/.98 var(--display);letter-spacing:-.07em;margin:12px 0}.owner-head p:last-child{font-size:12px;color:var(--muted);margin:0}.owner-user{font-size:10px;color:var(--muted)}.owner-signout{border:1px solid var(--ink);background:transparent;padding:11px 15px;font-size:10px;cursor:pointer}.owner-status{font-size:11px;line-height:1.6;color:#7d3024;margin:12px 0}.owner-auth-actions{display:flex;gap:10px;flex-wrap:wrap}.owner-auth-actions button{padding:11px 14px;border:1px solid var(--ink);background:transparent;font-size:10px;cursor:pointer}.owner-auth-actions button[hidden]{display:none}.owner-orders{display:grid;gap:16px}.owner-empty{padding:30px;border:1px solid var(--line);font-size:12px;color:var(--muted)}.owner-order{border:1px solid var(--line);padding:22px;background:#f8f6f1}.owner-order-head{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:15px}.owner-order-head h2{font:500 18px var(--display);margin:0 0 6px}.owner-order-head p,.owner-order-head time{font-size:10px;color:var(--muted);margin:0}.owner-order-total{font:600 14px var(--display);white-space:nowrap}.owner-order-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;padding:18px 0}.owner-order-grid h3{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.owner-order-lines{display:grid;gap:9px}.owner-order-line{display:flex;justify-content:space-between;gap:15px;font-size:10px;line-height:1.5}.owner-order-line b{font-weight:600;text-align:right;white-space:nowrap}.owner-address{font-size:10px;line-height:1.7}.owner-order-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;border-top:1px solid var(--line);padding-top:16px}.owner-order-controls label{display:grid;gap:7px;font-size:9px;font-weight:600}.owner-order-controls select{width:100%;padding:10px;border:1px solid var(--line);background:var(--paper);font:10px var(--sans)}.owner-save{padding:11px 14px;border:0;background:var(--ink);color:#fff;font-size:10px;cursor:pointer}.owner-save:disabled{opacity:.55;cursor:wait}.owner-footer{padding:25px 5%;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
    @media(max-width:680px){.owner-main{padding:35px 5% 60px}.owner-head{align-items:start}.owner-order{padding:16px}.owner-order-grid{grid-template-columns:1fr;gap:16px}.owner-order-controls{grid-template-columns:1fr}.owner-save{min-height:42px}}
  </style>
</head>
<body class="auth-checking">
  <div class="announcement"><span>UNCOMMON / OWNER</span><span>ORDER MANAGEMENT</span></div>
  <header class="header"><a class="wordmark" href="index.html" aria-label="Uncommon home"><img src="assets/uncommon-logo.png" alt="uncommon — wear different"></a><nav class="desktop-nav" aria-label="Owner navigation"><a href="index.html">Storefront</a></nav><div class="header-actions"><span class="owner-user"></span><button class="owner-signout" type="button">Sign out</button></div></header>
  <main class="owner-main"><div class="owner-head"><div><p class="eyebrow">PRIVATE STORE ADMIN</p><h1>Customer<br><em>orders.</em></h1><p>Review payment, delivery details and update order progress.</p></div></div><p class="owner-status" role="status" aria-live="polite"></p><div class="owner-auth-actions"><button class="owner-verify" type="button" hidden>Resend owner verification email</button><button class="owner-refresh" type="button" hidden>I verified — refresh access</button><button class="owner-return" type="button" hidden>Sign out and return to owner sign in</button></div><section class="owner-orders" aria-label="All customer orders"><p class="owner-empty">Loading orders...</p></section></main>
  <footer class="owner-footer">UNCOMMON · Owner order dashboard</footer>
  <script src="auth-config.js"></script>
  <script type="module" src="owner.js"></script>
</body>
</html>
