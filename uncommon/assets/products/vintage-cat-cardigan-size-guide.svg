<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title description">
  <title id="title">Vintage Cat Cardigan size guide</title>
  <desc id="description">Recommended sizes by height in centimeters and weight in kilograms and jin.</desc>
  <rect width="1100" height="530" fill="#f5f3ee"/>
  <text x="52" y="70" fill="#171717" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">UNCOMMON · SIZE GUIDE</text>
  <text x="52" y="130" fill="#171717" font-family="Arial,sans-serif" font-size="38" font-weight="700">Vintage Cat Cardigan</text>
  <text x="52" y="170" fill="#62615e" font-family="Arial,sans-serif" font-size="18">Recommended size by height and weight.</text>
  <rect x="42" y="198" width="1016" height="72" rx="10" fill="#171717"/>
  <g fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="120" y="243">HEIGHT (CM)</text><text x="430" y="243">WEIGHT (KG / JIN)</text><text x="835" y="243">SUGGESTED SIZE</text></g>
  <g font-family="Arial,sans-serif" font-size="22" fill="#202020">
    <rect x="42" y="270" width="1016" height="62" fill="#fff"/><text x="135" y="310">160–175 cm</text><text x="440" y="310">50–57.5 kg / 100–115 jin</text><text x="875" y="310">M</text>
    <rect x="42" y="332" width="1016" height="62" fill="#e9e7e2"/><text x="135" y="372">160–175 cm</text><text x="440" y="372">57.5–65 kg / 115–130 jin</text><text x="875" y="372">L</text>
    <rect x="42" y="394" width="1016" height="62" fill="#fff"/><text x="135" y="434">160–180 cm</text><text x="440" y="434">65–72.5 kg / 130–145 jin</text><text x="875" y="434">XL</text>
  </g>
  <text x="52" y="492" fill="#62615e" font-family="Arial,sans-serif" font-size="16">Weight conversion: 1 jin = 0.5 kg. If between sizes, consider your preferred relaxed fit.</text>
</svg>
