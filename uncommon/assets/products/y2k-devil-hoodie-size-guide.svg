<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title description">
  <title id="title">Y2K Devil Hoodie size chart</title>
  <desc id="description">English garment measurements in centimeters and inches for sizes S, M, L and XL.</desc>
