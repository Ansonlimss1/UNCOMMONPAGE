    <rect x="42" y="272" width="1316" height="66" fill="#fff"/><text x="78" y="314">S</text><text x="230" y="314">122 / 48.03</text><text x="500" y="314">61 / 24.02</text><text x="785" y="314">58 / 22.83</text><text x="1060" y="314">70 / 27.56</text>
