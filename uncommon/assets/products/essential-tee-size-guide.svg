<rect x="70" y="170" width="1060" height="100" rx="6" fill="#171715"/><g font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><text x="215" y="230">Height (cm)</text><text x="530" y="230">50–60 kg</text><text x="820" y="230">60–70 kg</text><text x="1040" y="230">70–80 kg</text></g>
<g font-family="Arial,sans-serif" font-size="28" fill="#171715" text-anchor="middle"><rect x="70" y="270" width="1060" height="120" fill="#fff"/><text x="215" y="342">160–165</text><text x="530" y="342">S</text><text x="820" y="342">M</text><text x="1040" y="342">—</text><rect x="70" y="390" width="1060" height="120" fill="#ecebe7"/><text x="215" y="462">165–170</text><text x="530" y="462">S</text><text x="820" y="462">M</text><text x="1040" y="462">—</text><rect x="70" y="510" width="1060" height="120" fill="#fff"/><text x="215" y="582">170–175</text><text x="530" y="582">M</text><text x="820" y="582">M</text><text x="1040" y="582">L</text><rect x="70" y="630" width="1060" height="120" fill="#ecebe7"/><text x="215" y="702">175–180</text><text x="530" y="702">—</text><text x="820" y="702">L</text><text x="1040" y="702">L</text></g><text x="600" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#68665f">Weight ranges converted from jin to kilograms · Suggested fit only</text><rect x="70" y="170" width="1060" height="580" rx="6" fill="none" stroke="#d8d5cd" stroke-width="2"/>
