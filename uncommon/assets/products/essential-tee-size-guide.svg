<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Essential Tee size recommendation chart</title><desc id="desc">Recommended tee sizes by height in centimeters and weight in kilograms.</desc>
