<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Off Script Tee Size Guide</title>
  <desc id="description">Recommended Off Script Tee sizes by weight, converted from jin to kilograms.</desc>
  <rect width="1200" height="800" fill="#1d1d1d"/>
  <rect x="38" y="36" width="1124" height="698" rx="16" fill="#222"/>
  <rect x="38" y="36" width="1124" height="116" rx="16" fill="#2b2b2b"/>
  <path d="M38 136h1124" stroke="#454545" stroke-width="2"/>
  <g stroke="#454545" stroke-width="2">
    <path d="M38 268h1124M38 384h1124M38 500h1124M38 616h1124"/>
    <path d="M700 36v698"/>
  </g>
  <g fill="#f4f2ed" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="369" y="110" font-size="34" font-weight="700">Weight range</text>
    <text x="931" y="110" font-size="34" font-weight="700">Recommended size</text>
    <text x="369" y="225" font-size="31">45–50 kg (90–100 jin)</text>
    <text x="931" y="225" font-size="36">M</text>
    <text x="369" y="341" font-size="31">50–60 kg (100–120 jin)</text>
    <text x="931" y="341" font-size="36">L</text>
    <text x="369" y="457" font-size="31">60–65 kg (120–130 jin)</text>
    <text x="931" y="457" font-size="36">XL</text>
    <text x="369" y="573" font-size="31">65–72.5 kg (130–145 jin)</text>
    <text x="931" y="573" font-size="36">2XL</text>
    <text x="369" y="689" font-size="31">72.5–80 kg (145–160 jin)</text>
    <text x="931" y="689" font-size="36">3XL</text>
  </g>
  <text x="600" y="775" fill="#aaa" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Weight converted from jin (斤): 1 jin = 0.5 kg</text>
</svg>
