<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Essential Zip-Up Cardigan size guide</title>
  <desc id="desc">Recommended sizes by height and approximate body weight: M for 165 to 170 centimeters and 50 to 57.5 kilograms; L for 170 to 180 centimeters and 57.5 to 65 kilograms; XL for 170 to 180 centimeters and 65 to 72.5 kilograms.</desc>
  <rect width="1100" height="620" fill="#f5f3ef"/>
  <text x="550" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#181818">ESSENTIAL ZIP-UP CARDIGAN</text>
  <text x="550" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#68645e">SIZE GUIDE · APPROXIMATE BODY MEASUREMENTS</text>
  <rect x="75" y="165" width="950" height="72" rx="4" fill="#191919"/>
  <text x="250" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">HEIGHT (CM)</text>
  <text x="575" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">WEIGHT (KG)</text>
  <text x="875" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">RECOMMENDED SIZE</text>
  <g font-family="Arial, sans-serif" font-size="25" fill="#202020" text-anchor="middle">
    <rect x="75" y="237" width="950" height="78" fill="#fff"/><text x="250" y="287">165–170 cm</text><text x="575" y="287">50–57.5 kg</text><text x="875" y="287">M</text>
    <rect x="75" y="315" width="950" height="78" fill="#e8e6e2"/><text x="250" y="365">170–180 cm</text><text x="575" y="365">57.5–65 kg</text><text x="875" y="365">L</text>
    <rect x="75" y="393" width="950" height="78" fill="#fff"/><text x="250" y="443">170–180 cm</text><text x="575" y="443">65–72.5 kg</text><text x="875" y="443">XL</text>
  </g>
  <text x="550" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#68645e">Weight ranges converted from the supplied chart (1 jin = 0.5 kg). Use as a general guide.</text>
</svg>
