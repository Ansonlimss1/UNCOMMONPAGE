<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title description">
  <title id="title">Blue Pixel Apple tee size chart</title>
  <desc id="description">English garment measurements in centimeters, recommended height in centimeters, and recommended weight in kilograms for sizes S through 3XL.</desc>
  <rect width="1300" height="760" fill="#f5f3ee"/>
  <text x="52" y="68" fill="#171717" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">UNCOMMON · SIZE GUIDE</text>
  <text x="52" y="126" fill="#171717" font-family="Arial,sans-serif" font-size="38" font-weight="700">Unisex Blue Pixel Apple Graphic Tee</text>
  <text x="52" y="166" fill="#62615e" font-family="Arial,sans-serif" font-size="18">Garment measurements are in centimeters. Height and weight are recommendations.</text>
  <rect x="42" y="198" width="1216" height="72" rx="10" fill="#171717"/>
  <g fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700"><text x="72" y="243">SIZE</text><text x="210" y="243">CHEST</text><text x="375" y="243">SHOULDER</text><text x="565" y="243">SLEEVE</text><text x="720" y="243">LENGTH</text><text x="850" y="243">HEIGHT (CM)</text><text x="1060" y="243">WEIGHT (KG)</text></g>
  <g font-family="Arial,sans-serif" font-size="19" fill="#202020">
    <rect x="42" y="270" width="1216" height="60" fill="#fff"/><text x="72" y="309">S</text><text x="220" y="309">94 cm</text><text x="405" y="309">44 cm</text><text x="590" y="309">19 cm</text><text x="745" y="309">65 cm</text><text x="875" y="309">160–165</text><text x="1085" y="309">45–55</text>
    <rect x="42" y="330" width="1216" height="60" fill="#e9e7e2"/><text x="72" y="369">M</text><text x="220" y="369">100 cm</text><text x="405" y="369">47 cm</text><text x="590" y="369">20 cm</text><text x="745" y="369">68 cm</text><text x="875" y="369">165–170</text><text x="1085" y="369">55–65</text>
    <rect x="42" y="390" width="1216" height="60" fill="#fff"/><text x="72" y="429">L</text><text x="220" y="429">106 cm</text><text x="405" y="429">50 cm</text><text x="590" y="429">21 cm</text><text x="745" y="429">71 cm</text><text x="875" y="429">170–175</text><text x="1085" y="429">65–75</text>
    <rect x="42" y="450" width="1216" height="60" fill="#e9e7e2"/><text x="72" y="489">XL</text><text x="220" y="489">112 cm</text><text x="405" y="489">53 cm</text><text x="590" y="489">22 cm</text><text x="745" y="489">74 cm</text><text x="875" y="489">175–180</text><text x="1085" y="489">75–85</text>
    <rect x="42" y="510" width="1216" height="60" fill="#fff"/><text x="72" y="549">2XL</text><text x="220" y="549">118 cm</text><text x="405" y="549">56 cm</text><text x="590" y="549">23 cm</text><text x="745" y="549">77 cm</text><text x="875" y="549">180–185</text><text x="1085" y="549">85–95</text>
    <rect x="42" y="570" width="1216" height="60" fill="#e9e7e2"/><text x="72" y="609">3XL</text><text x="220" y="609">124 cm</text><text x="405" y="609">59 cm</text><text x="590" y="609">24 cm</text><text x="745" y="609">80 cm</text><text x="875" y="609">185–190</text><text x="1085" y="609">95–105</text>
  </g>
  <text x="52" y="676" fill="#62615e" font-family="Arial,sans-serif" font-size="16">The source chart labels sizes XXL and XXXL; shown here as 2XL and 3XL.</text>
  <text x="52" y="710" fill="#62615e" font-family="Arial,sans-serif" font-size="16">Compare garment measurements with a tee you already own for your preferred fit.</text>
</svg>
