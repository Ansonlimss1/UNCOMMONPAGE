<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title description">
  <title id="title">Blue Graffiti Stripe Shirt size guide</title>
  <desc id="description">Recommended shirt sizes by height and weight, in centimeters, kilograms and jin.</desc>
  <rect width="1100" height="520" fill="#f5f3ee"/>
  <text x="52" y="70" fill="#171717" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">UNCOMMON · SIZE GUIDE</text>
  <text x="52" y="130" fill="#171717" font-family="Arial,sans-serif" font-size="38" font-weight="700">Blue Graffiti Stripe Shirt</text>
  <text x="52" y="170" fill="#62615e" font-family="Arial,sans-serif" font-size="18">Recommended size by height and weight.</text>
  <rect x="42" y="198" width="1016" height="72" rx="10" fill="#171717"/>
  <g fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="105" y="243">HEIGHT (CM)</text><text x="415" y="243">WEIGHT (KG / JIN)</text><text x="820" y="243">SUGGESTED SIZE</text></g>
  <g font-family="Arial,sans-serif" font-size="22" fill="#202020">
    <rect x="42" y="270" width="1016" height="62" fill="#fff"/><text x="120" y="310">150–160 cm</text><text x="430" y="310">40–47.5 kg / 80–95 jin</text><text x="870" y="310">S</text>
    <rect x="42" y="332" width="1016" height="62" fill="#e9e7e2"/><text x="120" y="372">160–170 cm</text><text x="430" y="372">47.5–60 kg / 95–120 jin</text><text x="870" y="372">M</text>
    <rect x="42" y="394" width="1016" height="62" fill="#fff"/><text x="120" y="434">165–175 cm</text><text x="430" y="434">60–70 kg / 120–140 jin</text><text x="870" y="434">L</text>
  </g>
  <text x="52" y="492" fill="#62615e" font-family="Arial,sans-serif" font-size="16">Weight conversion: 1 jin = 0.5 kg. If between sizes, consider your preferred relaxed fit.</text>
</svg>
